name: Create Release

on:
  push:
    branches: [main]
    paths:
      - 'api/config.json'
      - 'web/src/lib/version.ts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create per-component releases
        run: |
          create_release() {
            local component="$1"
            local version

            if [ "$component" = "api" ]; then
              version=$(python3 -c "import json; print(json.load(open('api/config.json'))['version'])")
            else
              version=$(grep -oP "VERSION\s*=\s*['\"]([^'\"]+)['\"]" web/src/lib/version.ts | grep -oP "['\"]([^'\"]+)['\"]" | tr -d "'\"")
            fi

            local tag="${component}-v${version}"
            local md="releases/${tag}.md"

            # Latest existing tag for this component (skip if already released)
            local latest
            latest=$(git tag -l "${component}-v*" --sort=-version:refname | head -1)
            if [ -n "$latest" ]; then
              local latest_ver="${latest#${component}-v}"
              if [ "$(printf '%s\n%s\n' "$latest_ver" "$version" | sort -V | tail -1)" = "$latest_ver" ]; then
                echo "Skip $component: $tag already released (latest $latest)"
                return
              fi
            fi

            local notes="$md"
            if [ ! -f "$notes" ]; then
              notes="/tmp/${tag}-notes.md"
              echo "## What's Changed" > "$notes"
              echo "" >> "$notes"
              echo "Release $tag" >> "$notes"
            fi

            echo "Creating release $tag"
            gh release create "$tag" --title "${component^^} v${version}" --notes-file "$notes"
          }

          create_release api
          create_release web
