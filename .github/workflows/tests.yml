name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'api/**'
      - '.github/workflows/tests.yml'
      - '.pre-commit-config.yaml'
  pull_request:
    branches: [main, master]
    paths:
      - 'api/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: api/pyproject.toml

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint with ruff
        run: uv run ruff check --output-format=github

      - name: Check formatting with ruff
        run: uv run ruff format --check

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: api/pyproject.toml

      - name: Install dependencies
        run: uv sync --frozen

      - name: Download test data
        run: |
          mkdir -p data
          curl -sL 'https://raw.githubusercontent.com/martj42/international_results/main/results.csv' \
            | head -1000 > data/results.csv

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short 2>&1 | head -100

      - name: Run tests (full output on failure)
        if: failure()
        run: uv run pytest tests/ -v --tb=long 2>&1 | tail -50
