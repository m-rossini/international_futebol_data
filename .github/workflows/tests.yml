name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'dashboards/**'
      - 'scripts/**'
      - '**.md'
  pull_request:
    branches: [main, master]

jobs:
  # ── API: lint + format ─────────────────────────────────
  api-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: api/pyproject.toml

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint with ruff
        run: uv run ruff check --output-format=github

      - name: Check formatting with ruff
        run: uv run ruff format --check

  # ── API: tests ─────────────────────────────────────────
  api-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: api/pyproject.toml

      - name: Install dependencies
        run: uv sync --frozen

      - name: Download test data
        run: |
          mkdir -p data
          curl -sL 'https://raw.githubusercontent.com/martj42/international_results/main/results.csv' \
            | head -1000 > data/results.csv

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short 2>&1 | head -100

      - name: Run tests (full output on failure)
        if: failure()
        run: uv run pytest tests/ -v --tb=long 2>&1 | tail -50

  # ── Web: lint + typecheck + format ─────────────────────
  web-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Check formatting with Prettier
        run: npm run format:check

  # ── Web: tests ─────────────────────────────────────────
  web-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --reporter=verbose
