# ── Pre-commit hooks ─────────────────────────────────────
# Install:  pip install pre-commit && pre-commit install
# Run all:  pre-commit run --all-files
# Skip:     SKIP=ruff git commit -m "..."

default_language_version:
  python: python3.14

repos:
  # ── Python: lint + format (ruff) ────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        name: ruff lint (api)
        types_or: [python, pyi]
        args: [--fix, --output-format=concise]
        files: ^api/
      - id: ruff-format
        name: ruff format (api)
        types_or: [python, pyi]
        files: ^api/

  # ── TypeScript / JS: format (prettier) ─────────────────
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: prettier format (web)
        types: [text]
        files: ^web/.*\.(ts|tsx|js|jsx|json|css|md|mdx|yaml|yml)$
        exclude: ^web/src/lib/version\.ts$
        additional_dependencies:
          - prettier@3.5.0

  # ── Generic file hygiene ────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: \.patch$|\.diff$
      - id: end-of-file-fixer
        exclude: \.patch$|\.diff$|\.pkl$|\.csv$|\.svg$
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^dashboards/
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-ast
        files: ^api/
      - id: check-json
        exclude: ^dashboards/|node_modules/
