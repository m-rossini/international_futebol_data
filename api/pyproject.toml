[project]
name = "international-futebol-data"
version = "0.2.0"
description = "Server for international football data stats"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.30.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "mcp>=1.0.0",
    "opentelemetry-distro>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx2>=2.4.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "pandas-stubs>=2.2.0",
]
