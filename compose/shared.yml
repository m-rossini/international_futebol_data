services:
  openobserve:
    # Fully-qualified and pinned. Rootless podman enforces short-name resolution
    # and cannot prompt for it without a TTY, so a bare "openobserve/openobserve"
    # or ":v1.0.4" fails to pull on the dev VPS. v1.0.4 is the current stable
    # release (verified end-to-end: OTLP logs/traces/metrics all ingest and are
    # queryable).
    image: docker.io/openobserve/openobserve:v1.0.4
    container_name: futebol-observe
    volumes:
      - oo_data:/data
    # Loopback-only: scripts/init-observability.sh runs on the host and needs to
    # reach OpenObserve to define streams + import dashboards. Not published
    # publicly — it holds the admin credentials.
    ports:
      - "127.0.0.1:5080:5080"
    environment:
      - ZO_ROOT_USER_EMAIL=admin@futebol.local
      - ZO_ROOT_USER_PASSWORD=Futebol@123
      - ZO_DATA_DIR=/data
      - ZO_COMPACT_ENABLED=true
      - ZO_COMPACT_INTERVAL=60
    restart: unless-stopped

volumes:
  oo_data:
