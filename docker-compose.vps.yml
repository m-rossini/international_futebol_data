# Production compose for VPS deployment.
# Images must be pre-loaded via: make prod-release
# Data directory must exist at: ./data/

services:
  nginx:
    image: nginx:alpine
    container_name: futebol-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/futebol-active.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot
    depends_on:
      - web
      - mcp
      - openobserve
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: futebol-certbot
    volumes:
      - certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew --webroot -w /var/www/certbot; done;'"
    depends_on:
      - nginx
    profiles:
      - renewal

  api:
    image: international-futebol-data:prod
    container_name: futebol-api
    volumes:
      - ./data:/data:ro
    environment:
      - DATA_DIR=/data
      - OTEL_SERVICE_NAME=futebol-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://openobserve:5080/api/default
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_HEADERS=Authorization=Basic YWRtaW5AZnV0ZWJvbC5sb2NhbDpGdXRlYm9sQDEyMw==,stream-name=api_logs
      - OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=true
    depends_on:
      openobserve:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7531/health')"]
      interval: 3m
      timeout: 5s
      retries: 3
      start_interval: 5s
      start_period: 10s
    restart: unless-stopped

  mcp:
    image: international-futebol-data:prod
    container_name: futebol-mcp
    environment:
      - API_BASE_URL=http://api:7531
      - MCP_REQUEST_TIMEOUT=30
      - OTEL_SERVICE_NAME=futebol-mcp
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://openobserve:5080/api/default
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_HEADERS=Authorization=Basic YWRtaW5AZnV0ZWJvbC5sb2NhbDpGdXRlYm9sQDEyMw==,stream-name=mcp_logs
    command: ["python", "football_stats/mcp_server.py", "--transport", "sse", "--port", "7532"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: futebol-web:prod
    container_name: futebol-web
    environment:
      - NEXT_PUBLIC_API_URL=http://api:7531
      - NEXT_PUBLIC_OO_ENDPOINT=
      - NEXT_PUBLIC_OO_BASIC_AUTH=YWRtaW5AZnV0ZWJvbC5sb2NhbDpGdXRlYm9sQDEyMw==
      - NEXT_PUBLIC_OO_ORG=default
      - NEXT_PUBLIC_OO_STREAM=web_events
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 3m
      timeout: 5s
      retries: 3
      start_interval: 5s
      start_period: 10s
    restart: unless-stopped

  openobserve:
    image: openobserve/openobserve:latest
    container_name: futebol-observe
    volumes:
      - oo_data:/data
    environment:
      - ZO_ROOT_USER_EMAIL=admin@futebol.local
      - ZO_ROOT_USER_PASSWORD=Futebol@123
      - ZO_DATA_DIR=/data
      - ZO_COMPACT_ENABLED=true
      - ZO_COMPACT_INTERVAL=60
    restart: unless-stopped

volumes:
  oo_data:
  certs:
  certbot_webroot:
