include:
  - compose/shared.yml

services:
  nginx:
    image: nginx:alpine
    container_name: futebol-nginx
    ports:
      - "80:80"
    volumes:
      # :z relabels bind mounts as shared container content. Required on
      # SELinux-enforcing hosts (rootless podman) — without it the container
      # gets Permission denied on every bind-mounted file. Ignored by
      # Docker where SELinux is disabled.
      - ./nginx/conf.d/futebol-local.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
      - web
      - mcp
      - openobserve
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: development
    container_name: futebol-api
    # Run as CONTAINER_USER (exported by Make, runtime-aware): 0:0 under
    # rootless podman (maps to the host user, so bind-mounted source, .venv,
    # precomputed caches and __pycache__ stay host-owned) or
    # LOCAL_UID:LOCAL_GID under Docker. `make` always sets this; direct
    # `compose` use falls back to 0:0 (podman behaviour).
    user: "${CONTAINER_USER:-0:0}"
    ports:
      - "7531:7531"
      - "5678:5678"
    volumes:
      - ./api:/app:z
      - ./releases:/app/releases:ro,z
      - ./infra/VERSION:/app/infra/VERSION:ro,z
      # Set DATA_VOLUME in .env to point to your CSV directory
      - ${DATA_VOLUME}:/data:ro,z
      # squads.csv ships in-repo (api/data/squads.csv) while the other CSVs
      # live in DATA_VOLUME. Mount it into /data so the loader finds the
      # full set. If squads.csv ever lands in DATA_VOLUME itself, drop this
      # line — the bind there would be shadowed by this file mount.
      - ./api/data/squads.csv:/data/squads.csv:ro,z
    environment:
      - DATA_DIR=/data
      # Keep uv's project venv out of the ./api bind mount (/app): the image
      # already bakes a venv into /app/.venv, but the bind hides it, so every
      # `uv run` would try to create /app/.venv on the shared host dir.
      # /tmp is container-local and always writable by the runtime user.
      - UV_PROJECT_ENVIRONMENT=/tmp/.venv
      # HOME/UV cache must be writable when running as a non-root user; uv
      # otherwise defaults to /.cache/uv and fails with permission denied.
      - HOME=/tmp
      - UV_CACHE_DIR=/tmp/.cache/uv
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OTEL_SERVICE_NAME=futebol-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://openobserve:5080/api/default
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_HEADERS=Authorization=Basic YWRtaW5AZnV0ZWJvbC5sb2NhbDpGdXRlYm9sQDEyMw==,stream-name=api_logs
      - OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=true
    command: ["uv", "run", "opentelemetry-instrument", "python", "football_stats/server.py", "--host", "0.0.0.0", "--port", "7531"]
    depends_on:
      openobserve:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7531/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_interval: 5s
      start_period: 30s
    restart: unless-stopped

  mcp:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: development
    container_name: futebol-mcp
    # Same runtime-aware user requirement as api (see note there).
    user: "${CONTAINER_USER:-0:0}"
    volumes:
      - ./api:/app:z
    environment:
      - API_BASE_URL=http://api:7531
      # Same as api: keep uv's venv in container-local /tmp, not the bind.
      - UV_PROJECT_ENVIRONMENT=/tmp/.venv
      # Writable HOME/uv cache for the non-root user (see note under api).
      - HOME=/tmp
      - UV_CACHE_DIR=/tmp/.cache/uv
      - MCP_REQUEST_TIMEOUT=30
      - OTEL_SERVICE_NAME=futebol-mcp
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://openobserve:5080/api/default
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_HEADERS=Authorization=Basic YWRtaW5AZnV0ZWJvbC5sb2NhbDpGdXRlYm9sQDEyMw==,stream-name=mcp_logs
    command: ["uv", "run", "python", "football_stats/mcp_server.py", "--transport", "streamable-http", "--port", "7532"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: development
    container_name: futebol-web
    # Same runtime-aware user requirement as api (see note there).
    user: "${CONTAINER_USER:-0:0}"
    # Publish Next.js dev server so it's reachable on the host (PORT_WEB=7500).
    ports:
      - "7500:3000"
    volumes:
      - ./web:/app:z
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://api:7531
      - NEXT_PUBLIC_OBS_PROVIDER=openobserve
      - NEXT_PUBLIC_OBS_ENDPOINT=
      - NEXT_PUBLIC_OBS_ORG=default
      - NEXT_PUBLIC_OBS_STREAM=web_events
      # NOTE: NEXT_PUBLIC_* vars are inlined into the browser bundle at build
      # time. For the prod image these must be passed as --build-arg (mk/deploy.mk);
      # the values below are ignored by the prebuilt futebol-web:prod image.
      # Server-only (no NEXT_PUBLIC_ prefix), so they are never inlined into the
      # client bundle. src/middleware.ts reads OBS_BASIC_AUTH at REQUEST time to
      # inject Basic auth for the /api/obs telemetry proxy.
      #
      # This used to be supplied only as a build-arg by mk/deploy.mk, so the
      # production image authenticated correctly while `docker compose up
      # --build` produced an image with an empty auth header — every ingest 401'd
      # and the `web_events` stream that every dashboard reads from stayed empty.
      # Setting it here fixes the local/dev path without touching the prod build.
      - OBS_BASIC_AUTH=${OBS_BASIC_AUTH:-YWRtaW5AZnV0ZWJvbC5sb2NhbDpGdXRlYm9sQDEyMw==}
      - OBS_PROXY_URL=${OBS_PROXY_URL:-http://openobserve:5080/api}
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
