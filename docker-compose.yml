services:
  nginx:
    image: nginx:alpine
    container_name: futebol-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/futebol-dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - mcp
      - openobserve
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: development
    container_name: futebol-api
    ports:
      - "7531:7531"
      - "5678:5678"
    volumes:
      - ./api:/app
      # Set DATA_VOLUME in .env to point to your CSV directory
      - ${DATA_VOLUME}:/data:ro
    environment:
      - DATA_DIR=/data
      - OTEL_SERVICE_NAME=futebol-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://openobserve:5080/api/default
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_HEADERS=Authorization=Basic YWRtaW5AZnV0ZWJvbC5sb2NhbDpGdXRlYm9sQDEyMw==,stream-name=api_logs
      - OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=true
    command: ["uv", "run", "opentelemetry-instrument", "python", "football_stats/server.py", "--host", "0.0.0.0", "--port", "7531"]
    depends_on:
      openobserve:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7531/health"]
      interval: 3m
      timeout: 5s
      retries: 3
      start_interval: 5s
      start_period: 30s
    restart: unless-stopped

  mcp:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: development
    container_name: futebol-mcp
    volumes:
      - ./api:/app
    environment:
      - API_BASE_URL=http://api:7531
      - MCP_REQUEST_TIMEOUT=30
      - OTEL_SERVICE_NAME=futebol-mcp
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://openobserve:5080/api/default
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_HEADERS=Authorization=Basic YWRtaW5AZnV0ZWJvbC5sb2NhbDpGdXRlYm9sQDEyMw==,stream-name=mcp_logs
    command: ["uv", "run", "python", "football_stats/mcp_server.py", "--transport", "sse", "--port", "7532"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: futebol-web
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://api:7531
      - NEXT_PUBLIC_OBS_PROVIDER=openobserve
      - NEXT_PUBLIC_OO_ENDPOINT=
      - NEXT_PUBLIC_OO_BASIC_AUTH=YWRtaW5AZnV0ZWJvbC5sb2NhbDpGdXRlYm9sQDEyMw==
      - NEXT_PUBLIC_OO_ORG=default
      - NEXT_PUBLIC_OO_STREAM=web_events
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  openobserve:
    image: openobserve/openobserve:latest
    container_name: futebol-observe
    volumes:
      - oo_data:/data
    environment:
      - ZO_ROOT_USER_EMAIL=admin@futebol.local
      - ZO_ROOT_USER_PASSWORD=Futebol@123
      - ZO_DATA_DIR=/data
      - ZO_COMPACT_ENABLED=true
      - ZO_COMPACT_INTERVAL=60
    healthcheck:
      test: ["CMD", "/openobserve", "node", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  oo_data:
