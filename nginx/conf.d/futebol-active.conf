# Production initial config — HTTP only, used for first cert generation
# After certbot generates certs, nginx switches to futebol.conf (HTTPS)
# Used by: docker-compose.prod.yml (initial deploy only)

upstream web_upstream {
    server web:3000;
}

upstream mcp_upstream {
    server mcp:7532;
}

upstream observe_upstream {
    server openobserve:5080;
}

server {
    listen 80;
    server_name futebol.orbisplace.co.uk futebol-observe.orbisplace.co.uk futebol-mcp.orbisplace.co.uk;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ─── Web ─────────────────────────────────────────────
    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── OpenObserve ─────────────────────────────────────
    location /observe/ {
        proxy_pass http://observe_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ─── MCP SSE ─────────────────────────────────────────
    location /mcp/ {
        proxy_pass http://mcp_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding off;
    }

    # ─── MCP messages ────────────────────────────────────
    location /messages/ {
        proxy_pass http://mcp_upstream/messages/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
