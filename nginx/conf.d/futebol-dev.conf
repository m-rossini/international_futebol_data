# Dev network — HTTP only, subdomain-based routing
# Used by: docker-compose.vps-internal.yml (Podman on Fedora)

upstream web_upstream {
    server web:3000;
}

upstream mcp_upstream {
    server mcp:7532;
}

upstream observe_upstream {
    server openobserve:5080;
}

# ─── Web (Next.js frontend) ──────────────────────────
server {
    listen 80;
    server_name futebol.boyz.local;

    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ─── OpenObserve dashboard ───────────────────────────
server {
    listen 80;
    server_name futebol-observe.boyz.local;

    location / {
        proxy_pass http://observe_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ─── MCP SSE endpoint ────────────────────────────────
server {
    listen 80;
    server_name futebol-mcp.boyz.local;

    location / {
        proxy_pass http://mcp_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE — no buffering, long timeout
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding off;
    }
}
