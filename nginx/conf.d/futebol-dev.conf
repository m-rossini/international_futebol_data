# Local dev — HTTP only, path-based routing via localhost
# Used by: docker-compose.yml

upstream web_upstream {
    server web:3000;
}

upstream mcp_upstream {
    server mcp:7532;
}

upstream observe_upstream {
    server openobserve:5080;
}

server {
    listen 80;
    server_name localhost;

    # ─── Web (Next.js frontend) ──────────────────────────
    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Next.js Turbopack HMR)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # ─── OpenObserve dashboard ───────────────────────────
    location /observe/ {
        proxy_pass http://observe_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (OpenObserve dashboard uses it)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ─── MCP SSE endpoint ────────────────────────────────
    location /mcp/ {
        proxy_pass http://mcp_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE — no buffering, long timeout
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding off;
    }

    # ─── MCP messages endpoint (must be at root) ─────────
    # MCP SSE protocol returns /messages/ as the POST endpoint.
    # The client POSTs here, not under /mcp/.
    location /messages/ {
        proxy_pass http://mcp_upstream/messages/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
