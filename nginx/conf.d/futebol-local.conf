# Local dev — HTTP only, subdomain-based routing
# Used by: docker-compose.yml

# ─── Web + API (futebol.localhost) ───────────────────

# Resolve upstream container names per request rather than once at startup.
#
# An `upstream { server api:7531; }` block resolves the name when nginx loads
# its config and then caches the resulting IP forever. Recreating a container
# gives it a new IP, so nginx keeps proxying to the dead address and every
# request 502s until nginx itself is restarted. Using a variable in proxy_pass
# defers resolution to request time and honours the `valid=` TTL below.
#
# This stack runs on Docker, whose embedded DNS is always 127.0.0.11, so the
# address is hardcoded here. The Podman VPS (futebol-dev.conf) uses its compose
# network gateway instead, which varies and is substituted at deploy time by
# scripts/set-nginx-resolver.sh.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name futebol.localhost;
    set $web_upstream "http://web:3000";
    set $api_upstream "http://api:7531";

    # API endpoints — exact paths
    location ~ ^/(docs|openapi\.json|redoc|scalar|health|version|filters|summary|biggest_wins|goals_per_year|head_to_head|top_scorers|matchgoals|cities|countries|conversation|releases)$ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Scalar self-hosted assets (e.g. /scalar/api-reference.js)
    location ~ ^/scalar/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API endpoints — parameterised sub-paths
    location ~ ^/(team/|tournament/|city/|country/|most/|fifa-ranking/|elo-ranking/|llm/) {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Web (Next.js frontend) — catch-all
    location / {
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Next.js Turbopack HMR)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}

# ─── OpenObserve dashboard ───────────────────────────
server {
    listen 80;
    server_name futebol-observe.localhost;
    set $observe_upstream "http://openobserve:5080";

    location / {
        proxy_pass $observe_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (OpenObserve dashboard uses it)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ─── MCP SSE endpoint ────────────────────────────────
server {
    listen 80;
    server_name futebol-mcp.localhost;
    set $mcp_upstream "http://mcp:7532";

    location / {
        proxy_pass $mcp_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE — no buffering, long timeout
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding off;
    }
}
