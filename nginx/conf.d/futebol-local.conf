# Local dev — HTTP only, subdomain-based routing
# Used by: docker-compose.yml

upstream web_upstream {
    server web:3000;
}

upstream api_upstream {
    server api:7531;
}

upstream mcp_upstream {
    server mcp:7532;
}

upstream observe_upstream {
    server openobserve:5080;
}

# ─── Web + API (futebol.localhost) ───────────────────
server {
    listen 80;
    server_name futebol.localhost;

    # API endpoints — exact paths
    location ~ ^/(docs|openapi\.json|redoc|scalar|health|version|filters|summary|biggest_wins|goals_per_year|head_to_head|top_scorers|matchgoals|cities|countries|conversation|releases)$ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Scalar self-hosted assets (e.g. /scalar/api-reference.js)
    location ~ ^/scalar/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API endpoints — parameterised sub-paths
    location ~ ^/(team/|tournament/|city/|country/|most/|fifa-ranking/|elo-ranking/|llm/) {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Web (Next.js frontend) — catch-all
    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Next.js Turbopack HMR)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}

# ─── OpenObserve dashboard ───────────────────────────
server {
    listen 80;
    server_name futebol-observe.localhost;

    location / {
        proxy_pass http://observe_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (OpenObserve dashboard uses it)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ─── MCP SSE endpoint ────────────────────────────────
server {
    listen 80;
    server_name futebol-mcp.localhost;

    location / {
        proxy_pass http://mcp_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE — no buffering, long timeout
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding off;
    }
}
