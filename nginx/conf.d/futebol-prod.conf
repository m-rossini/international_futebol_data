# Production — HTTPS with Let's Encrypt
# Used by: docker-compose.vps.yml
# Subdomains: futebol, futebol-observe, futebol-mcp

# ─── Upstream resolution ────────────────────────────────────

# Resolve upstream container names per request rather than once at startup.
#
# An `upstream { server api:7531; }` block resolves the name when nginx loads
# its config and then caches the resulting IP forever. Recreating a container
# gives it a new IP, so nginx keeps proxying to the dead address and every
# request 502s until nginx itself is restarted. Using a variable in proxy_pass
# defers resolution to request time and honours the `valid=` TTL below.
#
# Safe to convert here because no location below uses a trailing URI on
# proxy_pass (`proxy_pass $web_upstream;/`). With a URI part nginx skips
# the variable path entirely; without one the substitution applies as intended.
#
# @RESOLVER@ is substituted at deploy time by scripts/set-nginx-resolver.sh:
# Docker's embedded DNS is always 127.0.0.11, but Podman uses the compose
# network's gateway, which varies and so cannot be hardcoded here.
resolver @RESOLVER@ valid=10s ipv6=off;

# ─── HTTP → HTTPS redirect + ACME challenge ────────────────
server {
    listen 80;
    server_name futebol.orbisplace.co.uk futebol-observe.orbisplace.co.uk futebol-mcp.orbisplace.co.uk;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Web (HTTPS) ───────────────────────────────────────────
server {
    listen 443 ssl;
    server_name futebol.orbisplace.co.uk;
    set $web_upstream "http://web:3000";
    set $api_upstream "http://api:7531";

    ssl_certificate     /etc/letsencrypt/live/futebol.orbisplace.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/futebol.orbisplace.co.uk/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # API endpoints — exact paths
    location ~ ^/(docs|openapi\.json|redoc|scalar|health|version|filters|summary|biggest_wins|goals_per_year|head_to_head|top_scorers|matchgoals|cities|countries|conversation|releases)$ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Scalar self-hosted assets (e.g. /scalar/api-reference.js)
    location ~ ^/scalar/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API endpoints — parameterised sub-paths
    location ~ ^/(team/|tournament/|city/|country/|most/|fifa-ranking/|elo-ranking/|llm/) {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── OpenObserve (HTTPS) ───────────────────────────────────
server {
    listen 443 ssl;
    server_name futebol-observe.orbisplace.co.uk;
    set $observe_upstream "http://openobserve:5080";

    ssl_certificate     /etc/letsencrypt/live/futebol.orbisplace.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/futebol.orbisplace.co.uk/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        proxy_pass $observe_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ─── MCP (HTTPS) ───────────────────────────────────────────
server {
    listen 443 ssl;
    server_name futebol-mcp.orbisplace.co.uk;
    set $mcp_upstream "http://mcp:7532";

    ssl_certificate     /etc/letsencrypt/live/futebol.orbisplace.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/futebol.orbisplace.co.uk/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        proxy_pass $mcp_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE — no buffering, long timeout
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding off;
    }
}
